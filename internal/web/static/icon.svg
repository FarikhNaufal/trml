<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181a20" />
      <stop offset="100%" stop-color="#0b0e14" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd535" />
      <stop offset="50%" stop-color="#f0b90b" />
      <stop offset="100%" stop-color="#d89800" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ebd85" />
      <stop offset="100%" stop-color="#0ecb81" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bgGrad)" stroke="#2b313a" stroke-width="8" />

  <!-- Outer Binance Gold Accent Ring -->
  <rect x="36" y="36" width="440" height="440" rx="76" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.4" />

  <!-- Geometric Binance Candlestick & TRML Logo -->
  <g transform="translate(60, 60)">
    <!-- Terminal prompt symbol -->
    <path d="M60 120 L130 180 L60 240" fill="none" stroke="url(#goldGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="160" y1="240" x2="230" y2="240" stroke="url(#goldGrad)" stroke-width="24" stroke-linecap="round" />

    <!-- Candlestick chart elements -->
    <!-- Green Bullish Bar -->
    <line x1="280" y1="70" x2="280" y2="280" stroke="#0ecb81" stroke-width="6" stroke-linecap="round" />
    <rect x="264" y="110" width="32" height="110" rx="6" fill="url(#greenGrad)" filter="url(#glow)" />

    <!-- Gold Anchor Bar -->
    <line x1="340" y1="40" x2="340" y2="260" stroke="#f0b90b" stroke-width="6" stroke-linecap="round" />
    <rect x="324" y="70" width="32" height="130" rx="6" fill="url(#goldGrad)" filter="url(#glow)" />
  </g>

  <!-- TRML Typography -->
  <text x="256" y="415" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" fill="#eaecef" letter-spacing="12" text-anchor="middle">
    TR<tspan fill="#f0b90b">M</tspan>L
  </text>
  <text x="256" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#848e9c" letter-spacing="4" text-anchor="middle">
    BINANCE FUTURES BOT
  </text>
</svg>
